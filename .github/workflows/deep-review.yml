name: Deep review - CodeQL, coverage and installation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  codeql:
    name: CodeQL Python security-and-quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          languages: python
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          output: artifacts/codeql
          upload: true
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: codeql-sarif
          path: artifacts/codeql
          if-no-files-found: error
  coverage:
    name: Offline branch coverage - not ERP coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install coverage==7.13.3
      - run: python -m coverage run --branch --source=scripts scripts/run_local_checks.py --output artifacts/coverage-tests.json
      - run: python -m coverage json -o artifacts/coverage.json
      - run: python -m coverage report -m
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: offline-coverage
          path: artifacts/*.json
          if-no-files-found: error
  installation:
    name: Windows documented installation - local fixtures, no ERP
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python scripts/package_skill.py
      - run: python scripts/test_installation_flow.py --zip dist/testing-protheus-routines.zip --output artifacts/installation-flow.json
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: windows-installation-flow
          path: artifacts/installation-flow.json
          if-no-files-found: error
