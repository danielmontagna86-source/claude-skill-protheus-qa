name: Validate and package Protheus QA Skill
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-and-package:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Offline source tests - no ERP
        run: python scripts/run_local_checks.py --output artifacts/source-tests.json
      - name: Preserve contract and release consistency
        run: |
          python scripts/validate_skill.py
          python scripts/validate_tir_release.py
      - name: Verify pinned official TIR source
        run: python scripts/verify_tir_api.py --fetch
      - name: Package and inspect every entry
        run: |
          python scripts/package_skill.py
          python scripts/verify_distribution.py --zip dist/testing-protheus-routines.zip --output artifacts/package-check.json
      - name: Repeat tests from the distribution itself
        run: python scripts/test_packaged_skill.py --zip dist/testing-protheus-routines.zip --output artifacts/packaged-tests.json
      - name: Save validated package
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: testing-protheus-routines-${{ matrix.os }}
          path: |
            dist/testing-protheus-routines.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: qa-tests-${{ matrix.os }}
          path: artifacts/*.json
          if-no-files-found: error
          retention-days: 14

  compare-packages:
    name: Require identical Windows and Linux ZIPs
    needs: [validate-and-package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: testing-protheus-routines-ubuntu-latest
          path: artifacts/linux
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: testing-protheus-routines-windows-latest
          path: artifacts/windows
      - name: Byte-for-byte comparison, not only matching filenames
        run: python scripts/verify_distribution.py --zip artifacts/linux/testing-protheus-routines.zip --compare artifacts/windows/testing-protheus-routines.zip --output artifacts/cross-platform.json
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: distribution-review
          path: artifacts/cross-platform.json
          if-no-files-found: error

  runtime-audit:
    name: Install/import TIR and report dependency risks - not security approval
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Isolated runtime probe and separate auditor environment
        run: python scripts/audit_tir_runtime.py --install-and-audit --work-dir "${{ runner.temp }}/tir-qa-audit" --output-dir artifacts/dependency-review
      - name: Keep findings visible even when execution is not approved
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: dependency-review
          path: artifacts/dependency-review
          if-no-files-found: error
          retention-days: 30

  publish-prerelease:
    name: Publish and read back verified prerelease assets
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [compare-packages, runtime-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: testing-protheus-routines-ubuntu-latest
          path: dist
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: dependency-review
          path: artifacts/dependency-review
      - name: Publish candidate without overwriting prior assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]] || exit 1
          tag="v${version}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" dist/testing-protheus-routines.zip dist/SHA256SUMS.txt artifacts/dependency-review/* \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Protheus QA ${version} - TIR 2.14.10" \
              --notes-file "RELEASE_NOTES/${tag}.md" --prerelease --latest=false
          fi
      - name: Download published assets again and verify exact revision and bytes
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          python scripts/verify_release_assets.py --repo "$GITHUB_REPOSITORY" --tag "v${version}" --commit "$GITHUB_SHA" \
            --files dist/testing-protheus-routines.zip dist/SHA256SUMS.txt artifacts/dependency-review/* \
            --output artifacts/publication-verification.json
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: publication-verification
          path: artifacts/publication-verification.json
          if-no-files-found: error
